<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italiano Flashcards</title>
    <link rel="stylesheet" href="italian.css">
</head>

<body>
    <main class="page-shell">
        <section class="hero">
            <span class="eyebrow">Italiano interactivo</span>
            <h1>Tarjetas de vocabulario A1</h1>
            <p class="subtitle">Repasa verbos, conectores y expresiones clave con una interfaz moderna y ligera.</p>
        </section>

        <section class="wrap card-shell">
            <div class="card">
                <div id="q" class="word" aria-live="polite"></div>
                <div id="a" class="ans" aria-live="polite"></div>
                <div id="sentence-area" class="sentence-area" aria-live="polite" style="display:none;">
                    <!-- When no sentence saved: show textarea + save button. When saved: show sentence and edit button. -->
                    <div id="sentence-edit" style="display:none;">
                        <textarea id="sentence-input" class="premium-textarea" rows="2" placeholder="Escribe una oración con la palabra en italiano..."></textarea>
                        <div>
                            <button type="button" class="btn" id="save-sentence">Guardar</button>
                        </div>
                    </div>
                    <div id="sentence-view" style="display:none;">
                        <input id="sentence-text" class="readonly-input" readonly type="text" />
                        <button type="button" class="btn" id="edit-sentence">Editar</button>
                    </div>
                </div>
            </div>

            <div class="progress-row">
                <p id="progress" class="progress" aria-live="polite"></p>
            </div>

            <div class="row button-row">
                <button type="button" class="btn btn-accent" id="easy">😄 Fácil</button>
                <button type="button" class="btn btn-accent" id="med">😐 Dudé</button>
                <button type="button" class="btn btn-accent" id="hard">😫 Difícil</button>
            </div>
        </section>
    </main>
    <script src="italian.js"></script>
</body>

</html>
